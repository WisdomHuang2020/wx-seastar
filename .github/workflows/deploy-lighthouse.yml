# ─────────────────────────────────────────────────────────────
# SEA☆STAR 实益达 官网 —— 部署到腾讯云轻量应用服务器（Lighthouse）
#
# 四要素（完整对照表见 deploy/sites.yml）：
#   ① 仓库    git@github.com:WisdomHuang2020/wx-seastar.git   (main)
#   ② 工作流  本文件
#   ③ 目标    43.142.148.37（lhins-6i7vay90 / ap-shanghai / VM-0-12-ubuntu）
#             root@/var/www/wx-seastar   ← 必须等于 nginx 的 root
#   ④ 验证    https://www.wx-seastar.cn/
#
# 仓库 secrets（仓库级，站与站之间同名不冲突）：
#   LH_HOST / LH_USER / LH_ROOT / LH_SSH_KEY      （LH_PORT 可选，默认 22）
#   ⚠️ 在本机（Git Bash）写入 secrets 时必须加 MSYS_NO_PATHCONV=1，
#      否则 /var/www/wx-seastar 会被自动转成 Windows 路径。
#
# 站点形态：**纯静态多页站，零构建步骤** —— 仓库根即发布产物。
# 因此部署 = 把白名单文件 tar over ssh 推过去。
# ⚠️ 新增任何静态文件，必须同步更新下面 FILES 与 deploy/sites.yml 的 deploy_files；
#    脚本会断言清单每项存在，漏了会直接失败（而不是静默不上传）。
# ─────────────────────────────────────────────────────────────
name: Deploy to Lighthouse

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'deploy/**'
      - '.github/**'
      - 'VERSION'
  workflow_dispatch:

concurrency:
  group: deploy-lighthouse
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy www.wx-seastar.cn
    runs-on: ubuntu-latest
    # 防"假死"：曾实测 SSH 通道断开后步骤仍挂在 in_progress，
    # 既占 concurrency 锁又让后续 push 不触发。超时后自动失败释放。
    timeout-minutes: 10
    env:
      FILES: >-
        index.html odm.html lighting.html grow-light.html about.html contact.html oem.html facilities.html
        docs.html 404.html styles.css js assets cn favicon.ico apple-touch-icon.png
        robots.txt sitemap.xml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version & check configuration
        id: cfg
        run: |
          set -eu
          echo "version=$(cat VERSION 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          if [ -n "${{ secrets.LH_HOST }}" ] && [ -n "${{ secrets.LH_SSH_KEY }}" ]; then
            echo "ready=true"  >> "$GITHUB_OUTPUT"
            echo "配置就绪：将部署到 ${{ secrets.LH_HOST }}:${{ secrets.LH_ROOT }}"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::LH_* secrets 尚未配置，本次跳过部署（这不是失败）。"
            echo "::warning::配置入口：仓库 Settings → Secrets and variables → Actions"
          fi

      - name: Assert deploy manifest
        run: |
          set -eu
          missing=0
          for f in $FILES; do
            if [ ! -e "$f" ]; then
              echo "::error::发布清单中的 $f 不存在 —— 新增静态文件后需同步更新本工作流的 FILES 与 deploy/sites.yml"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "发布清单 $FILES 全部就位"

      - name: Deploy to server over SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          LH_HOST:    ${{ secrets.LH_HOST }}
          LH_USER:    ${{ secrets.LH_USER }}
          LH_ROOT:    ${{ secrets.LH_ROOT }}
          LH_SSH_KEY: ${{ secrets.LH_SSH_KEY }}
          LH_PORT:    ${{ secrets.LH_PORT }}
          VERSION:    ${{ steps.cfg.outputs.version }}
        run: |
          set -euo pipefail
          port="${LH_PORT:-22}"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$LH_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$port" -H "$LH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # 读取废弃文件清单（CI 是增量覆盖，不会自动删除已在仓库移除的文件）
          OBSOLETE="$(grep -vE '^[[:space:]]*(#|$)' deploy/obsolete.txt | tr '\n' ' ' || true)"
          echo "废弃清单: ${OBSOLETE:-（空）}"

          # ① 本地打包
          tar czf /tmp/deploy.tgz $FILES

          # ② scp 传输
          #    ⚠️ 这里刻意**不用 `tar czf - | ssh ...` 管道**：
          #    远端 `tar xzf -` 从 stdin 读数据流，一旦 SSH 的 EOF 传递异常，
          #    tar 会**永久阻塞在 stdin**，导致后面的 chown / 写哨兵全部不执行 ——
          #    表现为「文件已更新，但哨兵还是旧版本、CI 步骤一直 in_progress」。
          #    scp 不走管道，从根上避免这个问题。
          echo "==> scp 传输中（$(du -h /tmp/deploy.tgz | cut -f1)）"
          # -o BatchMode=yes：绝不交互提问（CI 里无人可答，一旦提问就会永久挂起）
          # -o ConnectTimeout / ServerAliveInterval：给握手与保活加硬性上限
          SCP_OPTS="-o BatchMode=yes -o ConnectTimeout=25 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          if ! scp -v -i ~/.ssh/deploy_key -P "$port" $SCP_OPTS \
                 -o StrictHostKeyChecking=yes \
                 /tmp/deploy.tgz "$LH_USER@$LH_HOST:/tmp/wx-seastar-deploy.tgz" 2>&1 | tail -25; then
            echo "::error::scp 传输失败"
            exit 1
          fi
          echo "==> scp 完成"

          # ③ 解包与收尾（ssh 用 -n 明确不读 stdin）
          echo "==> 远端解包与收尾"
          ssh -n -i ~/.ssh/deploy_key -p "$port" $SCP_OPTS \
            -o StrictHostKeyChecking=yes \
            "$LH_USER@$LH_HOST" "
            set -euo pipefail
            WEB_ROOT='$LH_ROOT'
            VERSION='$VERSION'
            OBSOLETE='$OBSOLETE'
            [ -d \"\$WEB_ROOT\" ] || { echo 'ERROR: web root 不存在:' \"\$WEB_ROOT\"; exit 1; }
            BK=\"\$HOME/webroot-backup-\$(date +%F-%H%M%S).tar.gz\"
            tar czf \"\$BK\" -C \"\$WEB_ROOT\" .
            echo \"已备份: \$BK\"
            tar xzf /tmp/wx-seastar-deploy.tgz -C \"\$WEB_ROOT\"
            rm -f /tmp/wx-seastar-deploy.tgz
            for f in \$OBSOLETE; do
              if [ -e \"\$WEB_ROOT/\$f\" ]; then
                rm -f \"\$WEB_ROOT/\$f\"
                echo \"已清理废弃文件: \$f\"
              fi
            done
            chown -R www-data:www-data \"\$WEB_ROOT\"
            printf '%s\n' \"\$VERSION\" > \"\$WEB_ROOT/.deployed-version\"
            echo \"哨兵已写: \$WEB_ROOT/.deployed-version = \$VERSION\"
            ls -t \"\$HOME\"/webroot-backup-*.tar.gz 2>/dev/null | tail -n +4 | xargs -r rm -f
            echo '--- 服务器本地回环自检 ---'
            curl -sk --resolve www.wx-seastar.cn:443:127.0.0.1 -o /dev/null -w '  首页       http=%{http_code}\n' --max-time 10 https://www.wx-seastar.cn/
            curl -sk --resolve www.wx-seastar.cn:443:127.0.0.1 -o /dev/null -w '  ODM 页     http=%{http_code}\n' --max-time 10 https://www.wx-seastar.cn/odm.html
            curl -sk --resolve www.wx-seastar.cn:443:127.0.0.1 -o /dev/null -w '  不存在路径 http=%{http_code}（应为 404）\n' --max-time 10 https://www.wx-seastar.cn/__deploy_probe__
            echo 'DEPLOY_DONE'
            "

      - name: Verify from public internet (non-blocking)
        if: steps.cfg.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set -u
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://www.wx-seastar.cn/ || echo 000)
          echo "线上首页 HTTP = $code"
          if [ "$code" != "200" ]; then
            echo "::warning::境外出口访问本服务器可能被 TLS 中断（已知现象），不代表部署失败；"
            echo "::warning::权威判据是上一步的「服务器本地回环自检」。"
          fi
