# www.wx-seastar.cn —— SEA☆STAR 实益达 官网（无锡市益明光电有限公司）
#
# 内容来源：仓库 https://github.com/WisdomHuang2020/wx-seastar
#   纯静态站、零构建步骤，仓库根即为发布产物：/var/www/wx-seastar
#
# ⚠️ 本文件为**独立配置**，不改动本机任何其它 server 块。
#
# ── 站点形态 ─────────────────────────────────────────────────────────────
#   多页静态站（7 个页面 + 404.html），**不是 SPA**。
#   对外地址**一律不带 .html 后缀**：/lighting ↔ 磁盘上的 lighting.html
#   实现见下方「干净 URL」一节，核心是 `try_files $uri $uri.html`。
#
# ── 证书 ────────────────────────────────────────────────────────────────
#   Let's Encrypt（certbot，2026-09-24 签发，有效期至 2026-12-23）
#   为 www.wx-seastar.cn 与 wx-seastar.cn 两个名称共用一张证书。

# ── 80：仅做 ACME 挑战 + 跳转 HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name www.wx-seastar.cn wx-seastar.cn;

    # ACME 挑战路径：certbot --webroot 写文件到 /var/www/acme
    include snippets/acme.conf;

    access_log /var/log/nginx/wx-seastar.access.log;
    error_log  /var/log/nginx/wx-seastar.error.log;

    location / {
        return 301 https://www.wx-seastar.cn$request_uri;
    }
}

# ── 443：裸域收敛到 www ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wx-seastar.cn;

    ssl_certificate     /etc/letsencrypt/live/www.wx-seastar.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.wx-seastar.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    # ACME 挑战路径：LE 续期会优先经 HTTPS 请求挑战文件，
    # 443 块若不含此路径会 404 → 续期失败（2026-09-26 实测踩到）
    include snippets/acme.conf;

    return 301 https://www.wx-seastar.cn$request_uri;
}

# ── 443：主站 ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wx-seastar.cn;

    ssl_certificate     /etc/letsencrypt/live/www.wx-seastar.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.wx-seastar.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    # ACME 挑战路径：LE 续期会优先经 HTTPS 请求挑战文件，
    # 443 块若不含此路径会 404 → 续期失败（2026-09-26 实测踩到）
    include snippets/acme.conf;
    add_header Strict-Transport-Security max-age=31536000 always;

    root /var/www/wx-seastar;
    index index.html;

    # 隐藏文件与常见敏感路径防护
    include snippets/security-hardening.conf;


    # favicon 缓存策略：favicon 是浏览器缓存最顽固的资源（独立缓存、Ctrl+F5 常不生效），
    #   故对裸 /favicon.ico 强制每回源校验。
    #   注意：不要试图用 `location ~* ^/favicon\.ico\?v=` 去区分带戳请求 ——
    #   nginx 的 location 只匹配 URI 路径、不含 query string，该规则永不命中。
    location = /favicon.ico {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }


    # ── 内容管理服务（Node，监听回环 3000）──────────────────────────
    # /api/*   前后台共用的接口
    # /admin   管理后台（零构建单页，由 Node 托管）
    # client_max_body_size 需 ≥ 后端文档上限(80MB)，留余量给 multipart 开销
    #
    # ⚠️ 这几个前缀必须用 `^~`：nginx 先比精确 `=`、再比 `^~` 前缀，
    #    最后才轮到**正则** location。下方「干净 URL」用的是正则，
    #    若这里不加 `^~`，后台与接口就会被那条规则误伤。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 96m;
    }
    location ^~ /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 96m;
    }

    # ── 上传的资源（图片长缓存；文档不缓存以便换版即生效）───────────
    location ^~ /uploads/img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location ^~ /uploads/doc/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }


    # ══ 干净 URL：对外一律不带 .html 后缀 ══════════════════════════════════
    # 磁盘上的文件名仍是 <name>.html，但对外只暴露 /<name>：
    #   · 访问 /lighting         → 由下方 `location /` 的 try_files 补 .html 命中
    #   · 访问 /lighting.html    → 301 到 /lighting（避免同一页面两个地址）
    #   · 访问 /index 或 /index.html → 301 到 /
    #
    # ⚠️ 坑 1：首页必须用 `location = /` 显式 try_files 交给 index.html。
    #   不能只靠 `index index.html;` —— 那会让 index 模块做一次
    #   「内部重写 / → /index.html」，重写后会**重新匹配 location**，
    #   正好撞上下面那条 `/index.html → 301 /`，变成自我重定向死循环
    #   （实测：/ 返回 301 且 Location 还是 /）。
    #
    # ⚠️ 坑 2：不提供「自动去掉结尾斜杠」的通用规则。
    #   那会对**真实目录**造成死循环：/assets → 301 /assets/（目录跳转）
    #   → 若再把 /assets/ 301 回 /assets 就会无限重定向（实测 /assets 确为 301）。
    #   故 /lighting/ 这类带斜杠的地址直接 404 —— 规范地址就是 /lighting。

    location = / {
        try_files /index.html =404;
    }
    location = /index.html { return 301 /; }
    location = /index      { return 301 /; }

    # 404 页只允许 error_page 内部跳转，不对外单独提供（robots.txt 亦已屏蔽）
    location = /404.html { internal; }

    # /lighting.html → /lighting ，并保留 query string
    location ~ ^/([A-Za-z0-9_-]+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # 多页静态站：先找原样路径，再补 .html 命中真实页面文件
    #   ⚠️ 不可回落 index.html —— 那会让不存在的页面返回首页内容 + 200，
    #      既误导访客也损害 SEO。未命中一律交给 error_page 的 404.html。
    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
